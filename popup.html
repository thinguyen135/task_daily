<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Planner</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <canvas id="stars-canvas" aria-hidden="true"></canvas>
  <div id="toast-container"></div>

  <div class="modal-overlay" id="yearModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="yearModalTitle">
      <div class="modal-title" id="yearModalTitle">THÁNG 1</div>
      <button class="modal-close" id="closeYearModalBtn" type="button" aria-label="Đóng">x</button>
      <div class="form-group modal-goal-form">
        <label class="form-label" for="yearGoalInput">Thêm mục tiêu cho tháng này</label>
        <input type="text" id="yearGoalInput" placeholder="Nhập mục tiêu của bạn...">
      </div>
      <button class="btn btn-primary full-button modal-save-btn" id="saveYearGoalBtn" type="button">Lưu mục tiêu</button>
      <div id="yearGoalList" class="task-list"></div>
    </div>
  </div>

  <main class="app-wrap">
    <header class="header">
      <div class="header-logo">Nova Planner</div>
      <div class="header-sub">Kế hoạch của bạn · Tương lai của bạn</div>
      <div class="clock-display" id="clockDisplay">00:00:00</div>
      <div class="date-display" id="dateDisplay"></div>
    </header>

    <nav class="tabs" aria-label="Chế độ lập kế hoạch">
      <button class="tab-btn active" type="button" data-tab="day">Ngày</button>
      <button class="tab-btn" type="button" data-tab="pomodoro">🍅 Pomodoro</button>
    </nav>

    <section class="panel active" id="panel-day">
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-val" id="statTotal">0</div>
          <div class="stat-label">Tổng việc</div>
        </div>
        <div class="stat-box">
          <div class="stat-val stat-success" id="statDone">0</div>
          <div class="stat-label">Hoàn thành</div>
        </div>
        <div class="stat-box">
          <div class="stat-val stat-accent" id="statLeft">0</div>
          <div class="stat-label">Còn lại</div>
        </div>
      </div>

      <div class="card compact-card">
        <div class="progress-label">
          <span>Tiến độ hôm nay</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title"><span class="icon">⚡</span> Thêm mục tiêu ngày</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="taskName">Tên mục tiêu</label>
            <input type="text" id="taskName" placeholder="Ví dụ: Học tiếng Anh...">
          </div>
          <div class="form-group time-field">
            <label class="form-label" for="taskTime">Thời gian báo</label>
            <input type="time" id="taskTime">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="taskDesc">Mô tả</label>
            <input type="text" id="taskDesc" placeholder="Thêm mô tả...">
          </div>
          <div class="form-group priority-field">
            <label class="form-label" for="taskPriority">Ưu tiên</label>
            <select id="taskPriority">
              <option value="high">Cao</option>
              <option value="med" selected>Trung bình</option>
              <option value="low">Thấp</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary full-button" id="addTaskBtn" type="button">Thêm mục tiêu</button>
      </div>

      <div class="card">
        <div class="card-title"><span class="icon">🎯</span> Mục tiêu hôm nay</div>
        <div class="task-list" id="taskList"></div>
      </div>
    </section>

    <section class="panel" id="panel-month">
      <div class="card">
        <div class="cal-nav">
          <button class="btn btn-primary btn-sm" id="prevMonthBtn" type="button">Trước</button>
          <div class="cal-nav-title" id="calTitle"></div>
          <button class="btn btn-primary btn-sm" id="nextMonthBtn" type="button">Sau</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div class="card month-note-panel" id="monthNotePanel">
        <div class="month-note-date" id="monthNoteDate"></div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="mTaskName">Tên mục tiêu</label>
            <input type="text" id="mTaskName" placeholder="Nhiệm vụ cho ngày này...">
          </div>
          <div class="form-group time-field">
            <label class="form-label" for="mTaskTime">Giờ báo thức</label>
            <input type="time" id="mTaskTime">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="mTaskDesc">Mô tả chi tiết</label>
            <input type="text" id="mTaskDesc" placeholder="Ghi chú thêm...">
          </div>
          <div class="form-group priority-field">
            <label class="form-label" for="mTaskPriority">Ưu tiên</label>
            <select id="mTaskPriority">
              <option value="high">Cao</option>
              <option value="med" selected>Trung bình</option>
              <option value="low">Thấp</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary full-button month-add-btn" id="addMonthTaskBtn" type="button">Lên kế hoạch</button>
        <div class="task-list" id="monthTaskList"></div>
      </div>
    </section>

    <section class="panel" id="panel-year">
      <div class="card">
        <div class="year-nav">
          <button class="btn btn-primary btn-sm icon-only" id="prevYearBtn" type="button" aria-label="Năm trước">‹</button>
          <div class="year-title" id="yearTitle"></div>
          <button class="btn btn-primary btn-sm icon-only" id="nextYearBtn" type="button" aria-label="Năm sau">›</button>
        </div>
        <div class="year-months" id="yearMonths"></div>
      </div>
    </section>

    <section class="panel" id="panel-pomodoro">
      <!-- Phần 1: Đồng hồ Pomodoro -->
      <div class="card pomo-card">
        <div class="pomo-modes">
          <button class="mode-btn active" data-mode="work" data-time="25" type="button">Học tập (25p)</button>
          <button class="mode-btn" data-mode="short" data-time="5" type="button">Nghỉ ngắn (5p)</button>
          <button class="mode-btn" data-mode="long" data-time="15" type="button">Nghỉ dài (15p)</button>
        </div>

        <div id="pomo-timer" class="pomo-timer">25:00</div>
        <div id="pomo-status" class="pomo-status">Sẵn sàng tập trung</div>

        <div class="pomo-controls">
          <button id="pomo-start-btn" class="btn btn-primary" type="button">▶ Bắt đầu</button>
          <button id="pomo-pause-btn" class="btn btn-secondary" type="button">⏸ Tạm dừng</button>
          <button id="pomo-reset-btn" class="btn btn-danger" type="button">🔄 Đặt lại</button>
        </div>
      </div>

      <!-- Phần 2: Cài đặt Khung giờ học & Chặn trang web -->
      <div class="card blocker-card">
        <div class="card-title"><span class="icon">🚫</span> Chặn Web Trong Giờ Học</div>
        
        <div class="schedule-box">
          <label class="checkbox-label">
            <input type="checkbox" id="block-on-pomo" checked />
            <span>Tự động chặn khi Pomodoro ở chế độ <b>Học tập</b></span>
          </label>

          <label class="checkbox-label" style="margin-top: 6px;">
            <input type="checkbox" id="block-on-schedule" />
            <span>Chặn theo khung giờ học cố định:</span>
          </label>

          <div class="time-range">
            <span>Từ:</span>
            <input type="time" id="study-start-time" value="19:00" />
            <span>Đến:</span>
            <input type="time" id="study-end-time" value="22:00" />
            <button id="save-schedule-btn" class="btn btn-primary btn-sm" type="button">Lưu giờ</button>
          </div>
        </div>

        <div class="quick-presets">
          <div style="font-size: 11px; color: var(--muted); margin-bottom: 6px;">Gợi ý chặn nhanh các web gây nghiện:</div>
          <div class="preset-chips">
            <button class="preset-chip" type="button" data-domain="facebook.com">+ Facebook</button>
            <button class="preset-chip" type="button" data-domain="youtube.com">+ YouTube</button>
            <button class="preset-chip" type="button" data-domain="tiktok.com">+ TikTok</button>
            <button class="preset-chip" type="button" data-domain="instagram.com">+ Instagram</button>
            <button class="preset-chip" type="button" data-domain="reddit.com">+ Reddit</button>
            <button class="preset-chip" type="button" data-domain="netflix.com">+ Netflix</button>
          </div>
        </div>

        <div class="block-input-group">
          <input 
            type="text" 
            id="block-url-input" 
            placeholder="Dán link hoặc domain (VD: facebook.com)..." 
          />
          <button id="add-block-url-btn" class="btn btn-primary" type="button">+ Thêm</button>
        </div>

        <ul id="blocked-sites-list" class="blocked-list"></ul>
      </div>
    </section>
  </main>
</body>
</html>
